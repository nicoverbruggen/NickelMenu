name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: NickelMenu / Qt${{ matrix.qt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0
    - name: Build
      run: sh tools/build.sh --qt "${{ matrix.qt }}"
    - name: Upload
      uses: actions/upload-artifact@v5
      with:
        name: NickelMenu-qt${{ matrix.qt }}
        path: build/qt${{ matrix.qt }}/*.tgz
        if-no-files-found: error
