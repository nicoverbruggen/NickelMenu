name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to build'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: NickelMenu
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ inputs.tag_name }}
        submodules: true
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: test/syms/go.mod
        cache-dependency-path: test/syms/go.sum
    - name: Test
      run: cd test/syms && go test ./...
    - name: Build
      env:
        NM_VERSION: ${{ inputs.tag_name }}
      run: sh tools/build.sh
    - name: Attest
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: |
          build/qt*/*.tgz
    - name: Create draft release
      uses: actions/github-script@v8
      id: draft_release
      with:
        script: |
          const {data: {id: id}} = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: context.payload.inputs.tag_name,
            name: `NickelMenu ${context.payload.inputs.tag_name}`,
            draft: true,
            prerelease: /^qt6-/i.test(context.payload.inputs.tag_name),
          })
          core.setOutput('id', id)
    - name: Upload release asset
      uses: actions/github-script@v8
      with:
        retries: 3 # note: this applies to individual github.rest calls, not the entire script
        script: |
          const {readFile} = require('fs').promises
          for (const [qt, name] of [[5, 'KoboRoot.tgz'], [6, 'Kobo.tgz']]) {
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: '${{steps.draft_release.outputs.id}}',
              name,
              data: await readFile(`build/qt${qt}/${name}`),
            })
          }
